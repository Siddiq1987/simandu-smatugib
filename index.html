<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMANDU SMA TUGIB</title>
    <link rel="icon" href="https://i.ibb.co.com/QFrFdSkn/tugib-400px.png" />
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- SheetJS CDN (Export Excel) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Alpine.js CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }

        /* Background foto gedung sekolah khusus halaman login */
        .login-background {
            background-image:
                linear-gradient(rgba(7, 20, 48, 0.58), rgba(7, 20, 48, 0.68)),
                url('https://www.image2url.com/r2/default/images/1792575541785-ff6595db-2380-4d38-82d7-c4f4efcb29d6.png');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        @media (max-width: 640px) {
            .login-background {
                background-attachment: scroll;
                background-position: center;
            }
        }
        @page {
            size: A4 portrait;
            margin: 10mm;
        }
        @page portraitPage {
            size: A4 portrait;
            margin: 10mm;
        }
        @page landscapePage {
            size: A4 landscape;
            margin: 10mm;
        }
        @media print {
            /* Semua dokumen A4; seluruh area Rekapitulasi Absensi dicetak landscape. */
            .no-print, nav, header.no-print, footer.no-print, button.no-print { display: none !important; }
            .print-only { display: block !important; }
            html, body {
                background: #fff !important; color: #000 !important;
                width: auto !important; min-width: 0 !important; min-height: 0 !important;
                height: auto !important; margin: 0 !important; padding: 0 !important;
                overflow: visible !important; font-size: 10pt !important;
            }
            body { display: block !important; }
            main, section, article, .print-container, .document, .report {
                max-width: none !important; min-width: 0 !important;
                width: 100% !important; height: auto !important;
                margin-left: 0 !important; margin-right: 0 !important;
                box-shadow: none !important;
            }
            main { display: block !important; padding: 0 !important; }
            /* Hilangkan batas scroll agar isi dokumen tidak terpotong. */
            .overflow-auto, .overflow-hidden, .overflow-x-auto, .overflow-y-auto {
                overflow: visible !important; max-height: none !important; height: auto !important;
            }
            img, svg, canvas, video { max-width: 100% !important; }
            img { height: auto; }
            table { max-width: 100% !important; border-collapse: collapse !important; }
            th, td { overflow-wrap: anywhere; }
            tr, img, canvas, figure { break-inside: avoid; page-break-inside: avoid; }
            .print-portrait { page: portraitPage; size: A4 portrait; break-after: page; page-break-after: always; }
            .print-landscape {
                page: landscapePage; size: A4 landscape; break-before: page; page-break-before: always;
                width: 100% !important; max-width: none !important;
            }
            /* Grafik visualisasi selalu dimulai pada lembar baru saat cetak. Tetap mengikuti halaman A4 Landscape dari laporan rekapitulasi. */
            .print-landscape-content {
                page: landscapePage;
                width: 100% !important;
                max-width: none !important;
                break-before: page !important;
                page-break-before: always !important;
                break-inside: avoid !important;
                page-break-inside: avoid !important;
            }
            .print-portrait .overflow-x-auto, .print-landscape .overflow-x-auto { overflow: visible !important; }
            .print-portrait table, .print-landscape table { width: 100% !important; table-layout: auto !important; }
            .print-portrait th, .print-portrait td, .print-landscape th, .print-landscape td { padding: 2px !important; font-size: 7pt !important; }
            .print-landscape canvas { width: 100% !important; max-width: 260mm !important; height: 145mm !important; max-height: 145mm !important; }
            .print-landscape .h-64 { height: 145mm !important; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        }
        .overflow-x-auto::-webkit-scrollbar { height: 6px; }
        .overflow-x-auto::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col" x-data="appData()" x-init="initData()">

    <!-- 1. HALAMAN LOGIN -->
    <template x-if="!currentUser">
        <div class="login-background min-h-screen flex items-center justify-center p-4 w-full relative">
            <div class="bg-white rounded-2xl shadow-2xl overflow-hidden max-w-md w-full border border-white/20">
                <div class="bg-gradient-to-r from-blue-700 to-indigo-800 p-6 text-center text-white relative">
                    <img :src="sekolah.logo || 'https://smpittrisuksesdepok.sch.id/wp-content/uploads/2025/08/cropped-SMP-IT-TRI-SUKSES-400px.png'" alt="Logo" class="w-20 h-20 mx-auto" onerror="this.src='https://placehold.co/100x100/3b82f6/ffffff?text=LOGO'">
                    <h2 class="text-xl font-bold tracking-wide uppercase" x-text="sekolah.nama || 'SMP Islam Terpadu Tri Sukses'"></h2>
                    <p class="text-xl font-bold tracking-wide" x-text="'NPSN : ' + (sekolah.npsn || '70000744')"></p>
                    
                    <!-- Status Koneksi Database pada Halaman Login -->
                    <div class="mt-3 inline-flex items-center space-x-2 bg-slate-900/80 backdrop-blur-md px-3 py-1 rounded-full border border-white/20 text-xs shadow-md">
                        <span class="relative flex h-2 w-2">
                            <span :class="sheetConfig.webAppUrl ? 'animate-ping bg-emerald-400' : 'bg-rose-400'" class="absolute inline-flex h-full w-full rounded-full opacity-75"></span>
                            <span :class="sheetConfig.webAppUrl ? 'bg-emerald-500' : 'bg-rose-500'" class="relative inline-flex rounded-full h-2 w-2"></span>
                        </span>
                        <span class="font-medium text-white/90 text-[13px]" x-text="sheetConfig.webAppUrl ? 'Database Connected' : 'Database Offline'"></span>
                    </div>
                </div>

                <div class="p-6 md:p-8 space-y-5">
                    <div class="text-center">
                        <h3 class="text-lg font-bold text-slate-800">Selamat Datang</h3>
                        <p class="text-xs text-slate-800 font-bold">Silakan login menggunakan akun Anda</p>
                    </div>

                    <div x-show="loginError" x-transition class="p-3 bg-rose-50 border border-rose-200 text-rose-600 rounded-lg text-xs flex items-center space-x-2">
                        <i class="fas fa-exclamation-circle text-base flex-shrink-0"></i>
                        <span x-text="loginError"></span>
                    </div>

                    <form @submit.prevent="handleLogin()" class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Username</label>
                            <div class="relative">
                                <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400"><i class="fas fa-user"></i></span>
                                <input type="text" x-model="loginForm.username" required placeholder="admin / guru / kelas" class="w-full pl-9 pr-3 py-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Password</label>
                            <div class="relative">
                                <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400"><i class="fas fa-lock"></i></span>
                                <input type="password" x-model="loginForm.password" required placeholder="••••••••" class="w-full pl-9 pr-3 py-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500">
                            </div>
                        </div>

                        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg shadow-md transition-all flex items-center justify-center space-x-2 text-sm">
                            <i class="fas fa-sign-in-alt"></i>
                            <span>Masuk ke Sistem</span>
                        </button>
                    </form>
                    <h3 class="text-lg font-bold text-slate-800 text-center" id="hasil"></h3>
                    <script>
                        const teksBase64 = "QnkgQXNoIFNpZGRpcSBTVA==";
                        document.getElementById("hasil").innerText = atob(teksBase64);
                    </script>

                </div>
            </div>
        </div>
    </template>

    <!-- 2. APLIKASI UTAMA -->
    <template x-if="currentUser">
        <div class="min-h-screen w-full flex flex-col">
            <!-- HEADER APLIKASI -->
            <header class="bg-gradient-to-r from-blue-800 to-indigo-900 text-white shadow-md no-print">
                <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col md:flex-row items-center justify-between gap-3">
                    <div class="flex items-center space-x-3 text-center md:text-left">
                        <img :src="sekolah.logo || 'https://smpittrisuksesdepok.sch.id/wp-content/uploads/2025/08/cropped-SMP-IT-TRI-SUKSES-400px.png'" alt="Logo Sekolah" class="w-16 h-16 object-contain" onerror="this.src='https://placehold.co/100x100/3b82f6/ffffff?text=LOGO'">
                        <div>
                            <h1 class="text-lg md:text-xl font-bold tracking-wide uppercase" x-text="sekolah.nama || 'SMP Islam Terpadu Tri Sukses'"></h1>
                            <div class="text-lg md:text-xs font-bold tracking-wide">
                                <div class="flex flex-wrap items-center gap-x-3 gap-y-1 justify-center md:justify-start">
                                    <span><i class="fas fa-id-card mr-1"></i>NPSN : <span x-text="sekolah.npsn || '70000744'"></span></span>
                                    <span><i class="fas fa-map-marker-alt mr-1"></i><span x-text="sekolah.alamat || 'Jalan Raya Kalimulya No.36 - Kota Depok'"></span></span>
                                </div>
                                <!-- Status Koneksi Database pada Header (Di bawah NPSN & Alamat) -->
                                <div class="mt-0.5">
                                    <span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-bold border" 
                                        :class="sheetConfig.webAppUrl ? 'bg-emerald-500/20 text-emerald-300 border-emerald-400/30' : 'bg-rose-500/20 text-rose-300 border-rose-400/30'">
                                        <span class="w-1.5 h-1.5 rounded-full mr-1.5" :class="sheetConfig.webAppUrl ? 'bg-emerald-400 animate-pulse' : 'bg-rose-400'"></span>
                                        <span x-text="sheetConfig.webAppUrl ? 'Database Terhubung' : 'Database Terputus'"></span>
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="flex items-center space-x-3 bg-white/10 px-3 py-1.5 rounded-lg border border-white/10 text-xs">
                        <div class="text-right">
                            <div class="font-bold text-white flex items-center justify-end space-x-1">
                                <span x-text="currentUser.nama"></span>
                                <span :class="currentUser.role === 'admin' ? 'bg-amber-400 text-slate-900' : (currentUser.role === 'kelas' ? 'bg-purple-400 text-slate-900' : 'bg-emerald-400 text-slate-900')" class="px-1.5 py-0.2 rounded text-[10px] font-extrabold uppercase ml-1" x-text="currentUser.role"></span>
                            </div>
                            <div class="text-white text-[11px] font-bold" x-text="currentUser.role === 'admin' ? 'Administrator Utama' : (currentUser.role === 'kelas' ? 'Akun Kelas ' + currentUser.kelasAkses : currentUser.mapel)"></div>
                        </div>
                        <button @click="toggleFullscreen()" class="bg-blue-500 hover:bg-blue-600 text-white p-2 rounded-lg shadow-sm transition-all text-xs" title="Aktifkan / Keluar Fullscreen" aria-label="Aktifkan atau keluar dari fullscreen">
                            <i class="fas fa-expand"></i>
                        </button>
                        <button @click="handleLogout()" class="bg-rose-500 hover:bg-rose-600 text-white p-2 rounded-lg shadow-sm transition-all text-xs" title="Keluar / Logout">
                            <i class="fas fa-power-off"></i>
                        </button>
                    </div>
                </div>
            </header>

            <!-- NAVIGATION MENU HORIZONTAL -->
            <nav class="bg-blue-200 border-b border-slate-200 shadow-sm sticky top-0 z-40 no-print">
                <div class="max-w-7xl mx-auto px-2 sm:px-4">
                    <div class="flex items-center justify-between md:hidden py-2 px-2">
                        <span class="font-medium text-black font-bold text-sm flex items-center">
                            <i class="fas fa-compass text-blue-600 mr-2"></i> Menu Navigasi
                        </span>
                        <button @click="mobileMenuOpen = !mobileMenuOpen" class="text-slate-600 hover:text-blue-600 p-2 rounded-lg focus:outline-none">
                            <i class="fas" :class="mobileMenuOpen ? 'fa-times text-lg' : 'fa-bars text-lg'"></i>
                        </button>
                    </div>

                    <div :class="mobileMenuOpen ? 'block' : 'hidden md:block'" class="overflow-x-auto">
                        <div class="flex flex-col md:flex-row space-y-1 md:space-y-0 md:space-x-1 py-2 md:py-0 text-sm font-medium">
                            <template x-for="item in visibleMenuItems" :key="item.id">
                                <button 
                                    @click="changeTab(item.id)"
                                    :class="activeTab === item.id ? 'bg-blue-600 text-white shadow-sm' : 'text-black hover:bg-slate-100 hover:text-blue-600'"
                                    class="px-3 py-2.5 rounded-md flex items-center space-x-2 transition-all whitespace-nowrap text-left w-full md:w-auto">
                                    <i :class="item.icon" class="w-5 text-center"></i>
                                    <span x-text="item.label"></span>
                                </button>
                            </template>
                        </div>
                    </div>
                </div>
            </nav>

            <!-- MAIN CONTENT CONTAINER -->
            <main class="max-w-7xl mx-auto px-4 py-6 pb-24 flex-1 w-full">

                <!-- 1. DASHBOARD UTAMA -->
                <div x-show="activeTab === 'dashboard'" x-transition class="space-y-6">
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                            <div>
                                <p class="text-xs font-semibold uppercase text-slate-500" x-text="currentUser && currentUser.role === 'kelas' ? ('Siswa ' + currentUser.kelasAkses) : 'Total Siswa'"></p>
                                <h3 class="text-2xl font-extrabold text-slate-800 mt-1" x-text="currentUser && currentUser.role === 'kelas' ? getKelasSummary(currentUser.kelasAkses).totalSiswa : siswaList.length"></h3>
                                <p class="text-xs text-emerald-600 font-medium mt-0.5"><i class="fas fa-users mr-1"></i> <span x-text="currentUser && currentUser.role === 'kelas' ? 'Terdaftar di Kelas Ini' : 'Terdaftar di Sistem'"></span></p>
                            </div>
                            <div class="p-3.5 bg-blue-100 text-blue-600 rounded-xl"><i class="fas fa-user-graduate text-2xl"></i></div>
                        </div>

                        <!-- Template untuk Tampilan Admin / Guru -->
                        <template x-if="!currentUser || currentUser.role !== 'kelas'">
                            <div class="contents">
                                <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                                    <div>
                                        <p class="text-xs font-semibold uppercase text-slate-500">Guru & Pengampu</p>
                                        <h3 class="text-2xl font-extrabold text-slate-800 mt-1" x-text="guruList.length"></h3>
                                        <p class="text-xs text-indigo-600 font-medium mt-0.5"><i class="fas fa-book mr-1"></i> <span x-text="daftarMapel.length"></span> Mata Pelajaran</p>
                                    </div>
                                    <div class="p-3.5 bg-indigo-100 text-indigo-600 rounded-xl"><i class="fas fa-chalkboard-teacher text-2xl"></i></div>
                                </div>

                                <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                                    <div>
                                        <p class="text-xs font-semibold uppercase text-slate-500">Rombongan Belajar</p>
                                        <h3 class="text-2xl font-extrabold text-slate-800 mt-1" x-text="daftarKelas.length"></h3>
                                        <p class="text-xs text-amber-600 font-medium mt-0.5"><i class="fas fa-school mr-1"></i> Kelas Aktif</p>
                                    </div>
                                    <div class="p-3.5 bg-amber-100 text-amber-600 rounded-xl"><i class="fas fa-door-open text-2xl"></i></div>
                                </div>
                            </div>
                        </template>

                        <!-- Template Tambahan Khusus Tampilan Kelas / Siswa -->
                        <template x-if="currentUser && currentUser.role === 'kelas'">
                            <div class="contents">
                                <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                                    <div>
                                        <p class="text-xs font-semibold uppercase text-slate-500">Siswa Laki-Laki</p>
                                        <h3 class="text-2xl font-extrabold text-slate-800 mt-1" x-text="getKelasSummary(currentUser.kelasAkses).totalL"></h3>
                                        <p class="text-xs text-blue-600 font-medium mt-0.5"><i class="fas fa-mars mr-1"></i> Siswa Laki-laki</p>
                                    </div>
                                    <div class="p-3.5 bg-blue-50 text-blue-600 rounded-xl"><i class="fas fa-mars text-2xl"></i></div>
                                </div>

                                <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                                    <div>
                                        <p class="text-xs font-semibold uppercase text-slate-500">Siswa Perempuan</p>
                                        <h3 class="text-2xl font-extrabold text-slate-800 mt-1" x-text="getKelasSummary(currentUser.kelasAkses).totalP"></h3>
                                        <p class="text-xs text-pink-600 font-medium mt-0.5"><i class="fas fa-venus mr-1"></i> Siswa Perempuan</p>
                                    </div>
                                    <div class="p-3.5 bg-pink-50 text-pink-600 rounded-xl"><i class="fas fa-venus text-2xl"></i></div>
                                </div>
                            </div>
                        </template>

                        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                            <div>
                                <p class="text-xs font-semibold uppercase text-slate-500" x-text="currentUser && currentUser.role === 'kelas' ? 'Catatan Jurnal Kelas' : 'Total Presensi Record'"></p>
                                <h3 class="text-2xl font-extrabold text-slate-800 mt-1" x-text="currentUser && currentUser.role === 'kelas' ? filteredJurnal.length : absensiRecords.length"></h3>
                                <p class="text-xs text-teal-600 font-medium mt-0.5"><i class="fas fa-clipboard-check mr-1"></i> <span x-text="currentUser && currentUser.role === 'kelas' ? 'Sesi Pembelajaran' : 'Sesi Presensi'"></span></p>
                            </div>
                            <div class="p-3.5 bg-emerald-100 text-emerald-600 rounded-xl"><i class="fas fa-clipboard-check text-2xl"></i></div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 items-stretch">
                        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-3 h-full">
                            <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                                <h3 class="font-bold text-slate-800 flex items-center">
                                    <i class="fas fa-chart-line text-blue-600 mr-2"></i> 
                                    <span x-text="currentUser && currentUser.role === 'kelas' ? ('Grafik Presensi Kelas ' + currentUser.kelasAkses) : 'Grafik Ringkasan Presensi Siswa'"></span>
                                </h3>
                                <span class="text-xs text-slate-400 font-semibold">Total Sesi: <span class="text-indigo-600 font-bold" x-text="absensiRecords.length"></span> Rekord</span>
                            </div>
                            <div class="h-64 relative flex items-center justify-center">
                                <canvas id="chartPresensi"></canvas>
                            </div>
                        </div>

                        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-4 h-full min-w-0">
                            <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                                <h3 class="font-bold text-slate-800 flex items-center text-base"><i class="fas fa-bullhorn text-amber-500 mr-2 text-lg"></i> Pengumuman Sekolah</h3>
                                <span class="text-xs font-semibold text-amber-700 bg-amber-100 px-2.5 py-0.5 rounded-full" x-text="pengumumanList.length"></span>
                            </div>
                            <div class="space-y-3.5 max-h-72 overflow-y-auto pr-1">
                                <template x-for="p in pengumumanList" :key="p.id">
                                    <div :class="p.tipe === 'PENTING' ? 'bg-rose-50 border-rose-200 text-rose-900' : (p.tipe === 'AGENDA' ? 'bg-blue-50 border-blue-200 text-blue-900' : 'bg-amber-50 border-amber-200 text-amber-900')" class="p-4 border rounded-xl space-y-2 shadow-sm">
                                        <div class="flex items-center justify-between gap-2">
                                            <div class="font-extrabold text-sm md:text-base leading-snug" x-text="p.judul"></div>
                                            <span class="text-[10px] font-extrabold uppercase px-2 py-0.5 rounded-md tracking-wider flex-shrink-0" 
                                                :class="p.tipe === 'PENTING' ? 'bg-rose-200 text-rose-800' : (p.tipe === 'AGENDA' ? 'bg-blue-200 text-blue-800' : 'bg-amber-200 text-amber-800')" 
                                                x-text="p.tipe || 'INFO'"></span>
                                        </div>
                                        <p class="text-xs md:text-sm leading-relaxed font-medium text-slate-700" x-text="p.isi"></p>
                                        <div class="text-xs opacity-75 pt-1.5 border-t border-slate-200/50 text-right font-semibold text-slate-500 flex items-center justify-end gap-1">
                                            <i class="far fa-calendar-alt text-slate-400 text-xs"></i>
                                            <span x-text="formatTanggalSimple(p.tanggal)"></span>
                                        </div>
                                    </div>
                                </template>
                                <div x-show="pengumumanList.length === 0" class="py-8 text-center text-slate-400 italic text-sm">
                                    Belum ada pengumuman terbaru.
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Rekapitulasi Data & Presensi Hari Ini Per Kelas -->
                    <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-4">
                        <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                            <h3 class="font-bold text-slate-800 flex items-center">
                                <i class="fas fa-layer-group text-indigo-600 mr-2"></i> 
                                <span x-text="currentUser && currentUser.role === 'kelas' ? ('Status Presensi Hari Ini - Kelas ' + currentUser.kelasAkses) : 'Rekapitulasi Data & Presensi Hari Ini Per Kelas'"></span>
                            </h3>

                getAppsScriptCode() {
                    return `function doGet(e) {
  var action = e.parameter.action;
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  // Gunakan zona waktu Jakarta untuk seluruh tanggal di database.
  ss.setSpreadsheetTimeZone('Asia/Jakarta');
  
  if (action == 'getData') {
    var result = {
      Sekolah: getSheetData(ss, 'Sekolah')[0] || {},
      Mapel: (getSheetData(ss, 'Mapel') || []).map(function(r){ return r.nama || r.Nama; }),
      Kelas: (getSheetData(ss, 'Kelas') || []).map(function(r){ return r.nama || r.Nama; }),
      Pengumuman: getSheetData(ss, 'Pengumuman'),
      Guru: getSheetData(ss, 'Guru'),
      Siswa: getSheetData(ss, 'Siswa'),
      Absensi: getSheetData(ss, 'Absensi'),
      Penilaian: getSheetData(ss, 'Penilaian'),
      Jurnal: getSheetData(ss, 'Jurnal')
    };
    return ContentService.createTextOutput(JSON.stringify({status: 'success', data: result}))
      .setMimeType(ContentService.MimeType.JSON);
  }
}

function doPost(e) {
  try {
    var req = JSON.parse(e.postData.contents);
    var ss = SpreadsheetApp.getActiveSpreadsheet();
    ss.setSpreadsheetTimeZone('Asia/Jakarta');
    
    if (req.action == 'saveData' && req.tab) {
      saveToSheet(ss, req.tab, req.data);
      return ContentService.createTextOutput(JSON.stringify({status: 'success'}))
        .setMimeType(ContentService.MimeType.JSON);
    }
  } catch(err) {
    return ContentService.createTextOutput(JSON.stringify({status: 'error', message: err.toString()}))
      .setMimeType(ContentService.MimeType.JSON);
  }
}

function getSheetData(ss, sheetName) {
  var sheet = ss.getSheetByName(sheetName);
  if (!sheet) return [];
  var data = sheet.getDataRange().getValues();
  if (data.length <= 1) return [];
  var headers = data[0];
  var result = [];
  for (var i = 1; i < data.length; i++) {
    var row = {};
    for (var j = 0; j < headers.length; j++) {
      var val = data[i][j];
      // Hindari Date menjadi ISO UTC yang dapat bergeser ke hari sebelumnya.
      if (val instanceof Date && !isNaN(val.getTime())) {
        val = Utilities.formatDate(val, 'Asia/Jakarta', 'yyyy-MM-dd');
      } else {
        try { val = JSON.parse(val); } catch(e) {}
      }
      row[headers[j]] = val;
    }
    result.push(row);
  }
  return result;
}

function saveToSheet(ss, sheetName, dataArray) {
  var sheet = ss.getSheetByName(sheetName);
  if (!sheet) { sheet = ss.insertSheet(sheetName); }
  sheet.clear();
  
  if (!dataArray || dataArray.length == 0) return;
  if (!Array.isArray(dataArray)) dataArray = [dataArray];
  
  var keys = Object.keys(dataArray[0]);
  sheet.appendRow(keys);
  
  var rows = dataArray.map(function(item) {
    return keys.map(function(key) {
      var val = item[key];
      if (typeof val === 'object' && val !== null) { return JSON.stringify(val); }
      return val;
    });
  });
  
  sheet.getRange(2, 1, rows.length, keys.length).setValues(rows);
}`;

                            : this.filterJurnalKelas;

                        const cleanFilterDate = this.filterJurnalTanggal ? String(this.filterJurnalTanggal).split('T')[0] : '';
                        const matchTanggal = !cleanFilterDate || cleanJurnalDate === cleanFilterDate;
                        
                        const teacherMapels = (this.currentUser && this.currentUser.role === 'guru')
                            ? (this.currentUser.mapelSelected || [this.currentUser.mapel])

                getKelasSummary(kelasName) {
                    const siswaKelas = this.siswaList.filter(s => String(s.kelas) === String(kelasName));
                    const totalSiswa = siswaKelas.length;
                    const totalL = siswaKelas.filter(s => s.jk === 'L').length;
                    const totalP = siswaKelas.filter(s => s.jk === 'P').length;

                    const todayStr = todayJakarta();
                    const todayRec = this.absensiRecords.find(r => {
                        const recKelasMatch = String(r.kelas) === String(kelasName);
                        const recDateStr = r.tanggal ? String(r.tanggal).split('T')[0] : '';
                        return recKelasMatch && recDateStr === todayStr;
                    });

                    let H = 0, I = 0, S = 0, A = 0;
                    let todayRecorded = false;

                    if (todayRec && todayRec.data) {
                        todayRecorded = true;
                        let recData = todayRec.data;
                        if (typeof recData === 'string') {
                            try { recData = JSON.parse(recData); } catch(e) {}
                        }
                        if (recData && typeof recData === 'object') {
                            Object.values(recData).forEach(st => {
                                if (st === 'H') H++;
                                else if (st === 'I') I++;
                                else if (st === 'S') S++;
                                else if (st === 'A') A++;
                            });
                        }
                    }

                    return { totalSiswa, totalL, totalP, todayRecorded, H, I, S, A };
                },

                loadAbsensiSiswa() {
                    const targetKelas = String(this.absensiFilter.kelas);
                    const cleanFilterDate = this.absensiFilter.tanggal ? String(this.absensiFilter.tanggal).split('T')[0] : '';
                    
                    const siswaKelas = this.siswaList.filter(s => String(s.kelas) === targetKelas);

                    const currentRec = this.absensiRecords.find(r => {
                        const recKelasMatch = String(r.kelas) === targetKelas;
                        const recDateStr = r.tanggal ? String(r.tanggal).split('T')[0] : '';
                        return recKelasMatch && recDateStr === cleanFilterDate;
                    });

                    let savedData = {};
                    if (currentRec && currentRec.data) {
                        savedData = currentRec.data;
                        if (typeof savedData === 'string') {
                            try { savedData = JSON.parse(savedData); } catch(e) {}
                        }
                    }

                    this.listAbsensiAktif = siswaKelas.map(s => {
                        const statusTerdaftar = savedData[s.id] !== undefined ? savedData[s.id] : savedData[String(s.id)];
                        return {
                            siswaId: s.id,
                            nis: s.nis,
                            nama: s.nama,
                            status: statusTerdaftar || 'H'
                        };
                    });
                },

                saveAbsensi() {
                    const targetKelas = String(this.absensiFilter.kelas);
                    const cleanFilterDate = this.absensiFilter.tanggal ? String(this.absensiFilter.tanggal).split('T')[0] : '';

                    const statusMap = {};
                    this.listAbsensiAktif.forEach(item => {
                        statusMap[item.siswaId] = item.status;
                    });

                    const idx = this.absensiRecords.findIndex(r => {
                        const recKelasMatch = String(r.kelas) === targetKelas;
                        const recDateStr = r.tanggal ? String(r.tanggal).split('T')[0] : '';
                        return recKelasMatch && recDateStr === cleanFilterDate;
                    });

                    const payload = {
                        id: (idx !== -1) ? this.absensiRecords[idx].id : Date.now(),
                        kelas: targetKelas,
                        tanggal: cleanFilterDate,
                        data: statusMap
                    };

                    if (idx !== -1) {
                        this.absensiRecords[idx] = payload;
                    } else {
                        this.absensiRecords.push(payload);
                    }

                    localStorage.setItem('adm_absensi', JSON.stringify(this.absensiRecords));
                    this.pushDataToSheet('Absensi', this.absensiRecords);
                    alert(`Absensi Kelas ${targetKelas} tanggal ${this.formatTanggalSimple(cleanFilterDate)} berhasil disimpan!`);

                loadNilaiSiswa() {
                    const key = `${this.nilaiFilter.kelas}_${this.nilaiFilter.mapel}_${this.nilaiFilter.guru}`;
                    const siswaKelas = this.siswaList.filter(s => String(s.kelas) === String(this.nilaiFilter.kelas));

                    const existingRecord = this.penilaianRecords.find(r => r.key === key);

                    if (existingRecord && existingRecord.komponen) {
                        this.penilaianKomponen = existingRecord.komponen;
                    } else {
                        this.penilaianKomponen = [];
                    }

                    const savedScoresMap = (existingRecord && existingRecord.scores) ? existingRecord.scores : {};

                    this.listNilaiAktif = siswaKelas.map(s => {
                        const studentScores = savedScoresMap[s.id] || {};
                        const row = {
                            siswaId: s.id,
                            nis: s.nis,
                            nama: s.nama,
                            scores: { ...studentScores },
                            rataRata: 0
                        };
                        this.calculateAvg(row);
                        return row;
                    });
                },

                calculateAvg(row) {
                    if (this.penilaianKomponen.length === 0) {
                        row.rataRata = 0;
                        return;
                    }
                    let total = 0;
                    let count = 0;
                    this.penilaianKomponen.forEach(comp => {
                        const val = Number(row.scores[comp.id]);
                        if (!isNaN(val) && val > 0) {
                            total += val;
                            count++;
                        }
                    });
                    row.rataRata = count > 0 ? (total / count).toFixed(2) : "0.00";
                },

                savePenilaian() {
                    const key = `${this.nilaiFilter.kelas}_${this.nilaiFilter.mapel}_${this.nilaiFilter.guru}`;
                    const scoresMap = {};

                    this.listNilaiAktif.forEach(row => {
                        scoresMap[row.siswaId] = row.scores;
                    });

                    const payload = {
                        key,
                        kelas: this.nilaiFilter.kelas,
                        mapel: this.nilaiFilter.mapel,
                        guru: this.nilaiFilter.guru,
                        komponen: this.penilaianKomponen,
                        scores: scoresMap
                    };

                    const idx = this.penilaianRecords.findIndex(r => r.key === key);
                    if (idx !== -1) {
                        this.penilaianRecords[idx] = payload;
                    } else {
                        this.penilaianRecords.push(payload);
                    }

                    localStorage.setItem('adm_penilaian', JSON.stringify(this.penilaianRecords));
                    this.pushDataToSheet('Penilaian', this.penilaianRecords);
                    alert('Data Penilaian Pembelajaran berhasil disimpan!');
                },

                exportPenilaianExcel() {
                    if (typeof XLSX === 'undefined') {
                        alert('Library Excel belum dimuat. Periksa koneksi internet Anda.');
                        return;
                    }

                    const data = [];
                    const headers = ['NIS', 'Nama Siswa'];
                    this.penilaianKomponen.forEach(c => headers.push(c.nama));
                    headers.push('Rata-Rata');
                    data.push(headers);

                    this.listNilaiAktif.forEach(row => {
                        const r = [row.nis, row.nama];
                        this.penilaianKomponen.forEach(c => {
                            r.push(row.scores[c.id] || 0);
                        });
                        r.push(row.rataRata);
                        data.push(r);
                    });

                    const ws = XLSX.utils.aoa_to_sheet(data);
                    const wb = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(wb, ws, "Nilai Siswa");
                    XLSX.writeFile(wb, `Nilai_${this.nilaiFilter.kelas}_${this.nilaiFilter.mapel}.xlsx`);
                },

                },

                saveJurnal() {
                    if (!this.jurnalForm.materi || !this.jurnalForm.kegiatan) {
                        alert('Materi dan Kegiatan Pembelajaran wajib diisi!');
                        return;
                    }

                    const payload = {
                        id: Date.now(),
                        ...this.jurnalForm,
                        guru: this.currentUser ? this.currentUser.nama : 'Guru'
                    };

                    this.jurnalList.unshift(payload);
                    localStorage.setItem('adm_jurnal', JSON.stringify(this.jurnalList));
                    this.pushDataToSheet('Jurnal', this.jurnalList);
                    this.modalJurnal = false;
                },

                deleteJurnal(id) {
                    if (confirm('Hapus catatan jurnal ini?')) {
                        this.jurnalList = this.jurnalList.filter(j => j.id !== id);
                        localStorage.setItem('adm_jurnal', JSON.stringify(this.jurnalList));
                        this.pushDataToSheet('Jurnal', this.jurnalList);
                    }
                },

                get daysInMonth() {
                    const year = this.rekapFilter.tahun;
                    const month = this.rekapFilter.bulan;
                    const days = new Date(year, month + 1, 0).getDate();
                    return Array.from({ length: days }, (_, i) => i + 1);
                },

                get rekapBulananData() {
                    const siswaKelas = this.siswaList.filter(s => String(s.kelas) === String(this.rekapFilter.kelas));
                    const year = this.rekapFilter.tahun;
                    const month = this.rekapFilter.bulan;

                    return siswaKelas.map(s => {
                        const daily = {};
                        const summary = { H: 0, I: 0, S: 0, A: 0 };

                        this.daysInMonth.forEach(day => {
                            const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                            
                            const rec = this.absensiRecords.find(r => {
                                const recKelasMatch = String(r.kelas) === String(this.rekapFilter.kelas);
                                const recDateStr = r.tanggal ? String(r.tanggal).split('T')[0] : '';
                                return recKelasMatch && recDateStr === dateStr;
                            });

                            if (rec && rec.data) {
                                let recData = rec.data;
                                if (typeof recData === 'string') {
                                    try { recData = JSON.parse(recData); } catch(e) {}
                                }
                                if (recData && typeof recData === 'object') {
                                    const st = recData[s.id] !== undefined ? recData[s.id] : recData[String(s.id)];
                                    if (st) {
                                        daily[day] = st;
                                        if (summary[st] !== undefined) summary[st]++;
                                    } else {
                                        daily[day] = '';
                                    }
                                } else {
                                    daily[day] = '';
                                }
                            } else {
                                daily[day] = '';
                            }
                        });

                        return { siswaId: s.id, nis: s.nis, nama: s.nama, daily, summary };
                    });
                },

                get rekapPeriodikData() {
                    const siswaKelas = this.siswaList.filter(s => String(s.kelas) === String(this.rekapFilter.kelas));
                    const year = Number(this.rekapFilter.tahun);

                    let filterDates = (dateStr) => {
                        if (!dateStr) return false;
                        const cleanDate = String(dateStr).split('T')[0];
                        const parts = cleanDate.split('-');
                        if (parts.length < 3) return false;
                        const recYear = Number(parts[0]);
                        return recYear === year;
                    };

                    if (this.rekapFilter.tipe === 'semester') {
                        filterDates = (dateStr) => {
                            if (!dateStr) return false;
                            const cleanDate = String(dateStr).split('T')[0];
                            const parts = cleanDate.split('-');
                            if (parts.length < 3) return false;
                            const recYear = Number(parts[0]);
                            const recMonth = Number(parts[1]);
                            return recYear === year && recMonth >= 1 && recMonth <= 12;
                        };
                    }

                    const relevantRecords = this.absensiRecords.filter(r => String(r.kelas) === String(this.rekapFilter.kelas) && filterDates(r.tanggal));

                    return siswaKelas.map(s => {
                        let H = 0, I = 0, S = 0, A = 0;
                        relevantRecords.forEach(r => {
                            if (r.data) {
                                let recData = r.data;
                                if (typeof recData === 'string') {
                                    try { recData = JSON.parse(recData); } catch(e) {}
                                }
                                if (recData && typeof recData === 'object') {
                                    const st = recData[s.id] !== undefined ? recData[s.id] : recData[String(s.id)];
                                    if (st === 'H') H++;
                                    else if (st === 'I') I++;
                                    else if (st === 'S') S++;
                                    else if (st === 'A') A++;
                                }
                            }
                        });
                        const total = H + I + S + A;
                        const persentase = (total > 0 && H > 0) ? ((H / total) * 100).toFixed(0) : '0';
                        return { siswaId: s.id, nis: s.nis, nama: s.nama, H, I, S, A, persentase };
                    });
                },

                renderCharts() {
                    const ctx = document.getElementById('chartPresensi');
                    if (!ctx) return;

                    let totalH = 0, totalI = 0, totalS = 0, totalA = 0;
                    this.absensiRecords.forEach(r => {
                        let recData = r.data;
                        if (typeof recData === 'string') {
                            try { recData = JSON.parse(recData); } catch(e) {}
                        }
                        if (recData && typeof recData === 'object') {
                            Object.values(recData).forEach(st => {
                                if (st === 'H') totalH++;
                                else if (st === 'I') totalI++;
                                else if (st === 'S') totalS++;
                                else if (st === 'A') totalA++;
                            });
                        }
                    });

                    if (this.chartInstance) {
                        try { this.chartInstance.destroy(); } catch(e) {}
                    }

                    const grandTotal = totalH + totalI + totalS + totalA;

                    this.chartInstance = new Chart(ctx, {
                        type: 'doughnut',
                        data: {
                            labels: [
                                `Hadir (H)`,
                                `Izin (I)`,
                                `Sakit (S)`,
                                `Alpa (A)`
                            ],
                            datasets: [{
                                data: [totalH, totalI, totalS, totalA],
                                backgroundColor: ['#10b981', '#3b82f6', '#f59e0b', '#ef4444'],
                                borderWidth: 2,
                                borderColor: '#ffffff'
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: { 
                                    position: 'bottom',
                                    labels: {
                                        font: { size: 12, weight: '600' },
                                        padding: 15,
                                        usePointStyle: true,
                                        pointStyle: 'circle'
                                    }
                                },
                                tooltip: {
                                    callbacks: {
                                        label: function(context) {
                                            const label = context.label || '';
                                            const val = context.raw || 0;
                                            const percentage = grandTotal > 0 ? ((val / grandTotal) * 100).toFixed(1) : 0;
                                            return ` Jumlah: ${val} Presensi (${percentage}%)`;
                                        }
                                    }
                                }
                            }
                        }
                    });
                },

                renderChartRekap() {
                    const ctx = document.getElementById('chartRekapSiswa');
                    if (!ctx) return;

                    const data = this.rekapFilter.tipe === 'bulanan' ? this.rekapBulananData : this.rekapPeriodikData;
                    const labels = data.map(d => d.nama);
                    
                    const datasetH = data.map(d => this.rekapFilter.tipe === 'bulanan' ? d.summary.H : d.H);
                    const datasetI = data.map(d => this.rekapFilter.tipe === 'bulanan' ? d.summary.I : d.I);
                    const datasetS = data.map(d => this.rekapFilter.tipe === 'bulanan' ? d.summary.S : d.S);
                    const datasetA = data.map(d => this.rekapFilter.tipe === 'bulanan' ? d.summary.A : d.A);

                    if (this.chartRekapInstance) {
                        try { this.chartRekapInstance.destroy(); } catch(e) {}
                    }

                    this.chartRekapInstance = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: labels.length > 0 ? labels : ['Belum Ada Siswa'],
                            datasets: [
                                {
                                    label: 'Hadir (H)',
                                    data: datasetH.length > 0 ? datasetH : [0],
                                    borderColor: '#10b981',
                                    backgroundColor: 'rgba(16, 185, 129, 0.1)',
                                    tension: 0.3,
                                    fill: true,
                                    borderWidth: 2
                                },
                                {
                                    label: 'Izin (I)',
                                    data: datasetI.length > 0 ? datasetI : [0],
                                    borderColor: '#3b82f6',
                                    backgroundColor: 'rgba(59, 130, 246, 0.1)',
                                    tension: 0.3,
                                    fill: true,
                                    borderWidth: 2
                                },
                                {
                                    label: 'Sakit (S)',
                                    data: datasetS.length > 0 ? datasetS : [0],
                                    borderColor: '#f59e0b',
                                    backgroundColor: 'rgba(245, 158, 11, 0.1)',
                                    tension: 0.3,
                                    fill: true,
                                    borderWidth: 2
                                },
                                {
                                    label: 'Alpa (A)',
                                    data: datasetA.length > 0 ? datasetA : [0],
                                    borderColor: '#ef4444',
                                    backgroundColor: 'rgba(239, 68, 68, 0.1)',
                                    tension: 0.3,
                                    fill: true,
                                    borderWidth: 2
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            interaction: { mode: 'index', intersect: false },
                            scales: {
                                y: { beginAtZero: true, ticks: { precision: 0 } }
                            },
                            plugins: {
                                legend: { position: 'top' }
                            }
                        }
                    });
                }
            };
        }
    </script>
</body>
</html>
